<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de Fibra Optica - Zinier</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">Zinier</div>
            <h1>Analizador de Puertos IA</h1>
            <p>Sube una foto de tu panel de fibra optica para analisis instantaneo.</p>
        </header>

        <main>
            <div class="upload-section" id="upload-section">
                <input type="file" id="file-input" accept="image/*" hidden>
                <div class="upload-box" id="drop-zone">
                    <img src="https://img.icons8.com/ios/50/4a90e2/upload-to-cloud--v1.png" alt="Upload">
                    <p>Arrastra tu imagen aqui o <span>haz clic para buscar</span></p>
                    <p class="subtext">Soporta JPG, PNG, WEBP</p>
                </div>
            </div>

            <div class="preview-section hidden" id="preview-section">
                <div class="image-container">
                    <img id="image-preview" src="" alt="Vista previa">
                    <button class="close-btn" id="remove-img">x</button>
                </div>
                <button id="analyze-btn" class="primary-btn">
                    <span class="btn-text">Analizar Imagen</span>
                    <span class="loader hidden"></span>
                </button>
            </div>

            <div class="results-section hidden" id="results-section">
                <h2>Resultados del Analisis</h2>

                <div class="stats-grid">
                    <div class="stat-card total">
                        <h3>Total</h3>
                        <span id="res-total">-</span>
                    </div>
                    <div class="stat-card occupied">
                        <h3>Ocupados</h3>
                        <span id="res-occupied">-</span>
                    </div>
                    <div class="stat-card available">
                        <h3>Disponibles</h3>
                        <span id="res-available">-</span>
                    </div>
                </div>

                <div class="details-box">
                    <h3>Resumen IA</h3>
                    <p id="res-message">Esperando analisis...</p>
                </div>

                <div class="ports-list hidden" id="ports-list">
                    <h3>Detalle por Puerto</h3>
                    <ul id="ports-ul"></ul>
                </div>
            </div>
        </main>

        <div id="error-message" class="error-toast hidden"></div>
    </div>
    <script src="app.js"></script>
</body>

</html>
